<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex, nofollow" />
    <title>Administration du site - ASA Prenois Bourgogne</title>
    <link
      rel="icon"
      type="image/png"
      sizes="32x32"
      href="/assets/favicon-asa-nouveau.png"
    />
    <style>
      :root {
        --asa-bleu: #0d5fd0;
      }

      /* Lisibilite renforcee pour un public senior: leger agrandissement
         global de l'interface (s'applique aussi a l'application CMS). */
      body {
        margin: 0;
        zoom: 1.1;
      }

      /* Ecran de chargement affiche tant que Sveltia CMS s'initialise. */
      .asa-splash {
        position: fixed;
        inset: 0;
        z-index: 9999;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 28px;
        background: linear-gradient(160deg, #0a2a5c 0%, var(--asa-bleu) 100%);
        color: #ffffff;
        font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
        text-align: center;
        padding: 24px;
        transition: opacity 0.4s ease;
      }

      .asa-splash.is-hidden {
        opacity: 0;
        pointer-events: none;
      }

      .asa-splash img {
        width: 180px;
        max-width: 60vw;
        height: auto;
        background: #ffffff;
        border-radius: 16px;
        padding: 16px;
      }

      .asa-splash p {
        margin: 0;
        font-size: 22px;
        font-weight: 600;
      }

      .asa-splash .asa-splash-note {
        font-size: 16px;
        font-weight: 400;
        opacity: 0.85;
      }

      .asa-splash-spinner {
        width: 44px;
        height: 44px;
        border: 4px solid rgba(255, 255, 255, 0.35);
        border-top-color: #ffffff;
        border-radius: 50%;
        animation: asa-spin 0.9s linear infinite;
      }

      @keyframes asa-spin {
        to {
          transform: rotate(360deg);
        }
      }

      @media (prefers-reduced-motion: reduce) {
        .asa-splash-spinner {
          animation: none;
        }
      }

      /* Bouton d'aide permanent, par-dessus l'interface du CMS. */
      .asa-aide-btn {
        position: fixed;
        right: 18px;
        bottom: 18px;
        z-index: 10000;
        display: inline-flex;
        align-items: center;
        gap: 8px;
        padding: 12px 18px;
        border-radius: 999px;
        background: var(--asa-bleu);
        color: #ffffff;
        font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
        font-size: 16px;
        font-weight: 700;
        text-decoration: none;
        box-shadow: 0 4px 14px rgba(0, 0, 0, 0.3);
      }

      .asa-aide-btn:hover,
      .asa-aide-btn:focus-visible {
        background: #0a4aa3;
      }
    </style>
  </head>
  <body>
    <div class="asa-splash" id="asa-splash">
      <img
        src="/assets/logo-asa-prenois-bourgogne-fit.png"
        alt="Logo ASA Prenois Bourgogne"
      />
      <div class="asa-splash-spinner" aria-hidden="true"></div>
      <p>Chargement de l'espace d'administration...</p>
      <p class="asa-splash-note">
        Merci de patienter quelques secondes.
      </p>
    </div>

    <a class="asa-aide-btn" href="/admin/aide.html">? Besoin d'aide</a>

    <!--
      Sveltia CMS auto-heberge (version figee, sans dependance a un CDN
      externe). Fichier extrait du paquet npm officiel @sveltia/cms@0.170.8
      (integrite du paquet verifiee contre le registre npm:
      sha512-NEINLayY9fT1LfGLeDzaJ6q9snBq+9CSB48gQIE6Y9LBMReD7QfyUzKQJ9ZG7Kfw9knnoKYNOBkOSLqY1WxNRw==).
      Pour mettre a jour :
        1. Consulter https://github.com/sveltia/sveltia-cms/releases
        2. npm pack @sveltia/cms@NOUVELLE_VERSION puis extraire
           package/dist/sveltia-cms.js vers admin/vendor/sveltia-cms-NOUVELLE_VERSION.js
        3. Verifier l'integrite: npm view @sveltia/cms@NOUVELLE_VERSION dist.integrity
           doit correspondre au sha512 du .tgz telecharge
        4. Mettre a jour le src ci-dessous et supprimer l'ancien fichier vendor
        5. Tester /admin (connexion, modification, publication) avant de merger
    -->
    <script src="/admin/cms-init.js" type="module"></script>

    <script src="/admin/splash.js" defer></script>
  </body>
</html>
